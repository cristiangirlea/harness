name: release

# A v* tag builds hrn for Linux, macOS and Windows on amd64 and arm64 and
# publishes the binaries and their checksums as a GitHub release. The tests run
# first, so a tag on a broken commit publishes nothing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Standard hosted runners are free for public repositories. Refuse private-minute usage.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: build
        run: bash .github/release.sh "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
