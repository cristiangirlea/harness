name: release

# A v* tag builds hrn for Linux, macOS and Windows on amd64 and arm64 and
# publishes the binaries and their checksums as a GitHub release. The tests run
# first, so a tag on a broken commit publishes nothing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: build
        run: bash .github/release.sh "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
