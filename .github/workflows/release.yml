name: release

# A v* tag builds hrn for Linux, macOS and Windows on amd64 and arm64 and
# publishes the binaries and their checksums as a GitHub release. The tests run
# first, so a tag on a broken commit publishes nothing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Only on the local cluster's runner set (lab-harness, infra repo), which CI_RUNNER names;
    # without it no release is built, rather than one built on GitHub's runners.
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: build
        run: bash .github/release.sh "$GITHUB_REF_NAME"
      - name: install gh
        shell: bash
        # GitHub's runner image has gh; the lab runner image does not. Official apt repository,
        # as https://github.com/cli/cli/blob/trunk/docs/install_linux.md gives it.
        run: |
          command -v gh >/dev/null && exit 0
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q gh
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
