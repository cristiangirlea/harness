name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Standard hosted runners are free for public repositories. Refuse private-minute usage.
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Use Git Bash consistently on Linux and Windows.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: fuzz the SSE parser
        # Bound the number of fuzz workers independently of the runner's CPU count.
        # Counts, not durations (#70): with -fuzztime=10s Go's coordinator can report its
        # own deadline as a failure (a race between closing the deadline and cancelling
        # the workers), and minimization could take 60 s per input, longer than the run, so
        # all four workers could spend it minimizing. Each count is about 10 s on the lab
        # machine.
        # A count is the only bound left, and Go has no per-input hang detection, so a
        # hanging input would hold a runner slot: each step stops at 5 minutes, and fails,
        # so the next step and the crasher upload still run.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: go test -run='^$' -fuzz=FuzzParseSSE -fuzztime=150000x -fuzzminimizetime=200x -parallel=4 ./internal/agent
      - name: fuzz the MCP codec
        # always(), so a crash in the parser fuzzer does not hide this one.
        if: always() && matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: go test -run='^$' -fuzz=FuzzCodec -fuzztime=500000x -fuzzminimizetime=200x -parallel=4 ./internal/mcp
      - name: keep any input a fuzzer crashed on
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
      - name: shell scripts parse
        if: matrix.os == 'ubuntu-latest'
        run: bash -n .github/release.sh && bash -n scripts/api-check.sh
      - name: release dry run
        # The release job only runs on a tag, so its script is exercised here.
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/release.sh
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
