name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on Linux only; every push to main tests both. The Windows
        # leg runs on a runner on a desktop with no container around the job, so only
        # merged code may reach it; pull requests include branches written by agents.
        # Without CI_RUNNER_WINDOWS there is no Windows leg.
        os: ${{ github.event_name == 'push' && vars.CI_RUNNER_WINDOWS != '' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    # Only our own runners, never GitHub's: Linux on the local cluster's scale set (CI_RUNNER,
    # infra P2), Windows on the runner on this PC (CI_RUNNER_WINDOWS, infra P2b). Without
    # CI_RUNNER the job is skipped. matrix.os only picks the leg, so the steps' conditions
    # below do not change.
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.CI_RUNNER || vars.CI_RUNNER_WINDOWS }}
    # bash on every OS. Without it a Windows step runs in PowerShell: GitHub's images have
    # PowerShell 7, but a self-hosted Windows runner may only have Windows PowerShell 5.1, whose
    # default execution policy refuses the script file the runner writes for each step. Git Bash
    # is on our Windows runner's PATH ahead of System32 (infra P2b) and is GitHub's bash too.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: fuzz the SSE parser
        # -parallel=4: the fuzzer starts one worker per CPU it sees, and the lab runner's
        # container sees the node's 24 within a 3 GiB memory limit (GitHub's runner had 2-4).
        # Counts, not durations (#70): with -fuzztime=10s Go's coordinator can report its
        # own deadline as a failure (a race between closing the deadline and cancelling
        # the workers), and minimization had no bound, so all four workers could spend the
        # run minimizing. Each count is about 10 s on the lab runner.
        if: matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzParseSSE -fuzztime=150000x -fuzzminimizetime=200x -parallel=4 ./internal/agent
      - name: fuzz the MCP codec
        # always(), so a crash in the parser fuzzer does not hide this one.
        if: always() && matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzCodec -fuzztime=500000x -fuzzminimizetime=200x -parallel=4 ./internal/mcp
      - name: keep any input a fuzzer crashed on
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
      - name: shell scripts parse
        if: matrix.os == 'ubuntu-latest'
        run: bash -n .github/release.sh && bash -n scripts/api-check.sh
      - name: release dry run
        # The release job only runs on a tag, so its script is exercised here.
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/release.sh
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
