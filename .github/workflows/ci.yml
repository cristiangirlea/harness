name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows runners bill at twice the Linux rate on a private repo, so pull
        # requests test on Linux only; every push to main still tests both.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: fuzz the SSE parser
        if: matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzParseSSE -fuzztime=10s ./internal/agent
      - name: fuzz the MCP codec
        # always(), so a crash in the parser fuzzer does not hide this one.
        if: always() && matrix.os == 'ubuntu-latest'
        run: go test -run='^$' -fuzz=FuzzCodec -fuzztime=10s ./internal/mcp
      - name: keep any input a fuzzer crashed on
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
      - name: shell scripts parse
        if: matrix.os == 'ubuntu-latest'
        run: bash -n .github/release.sh && bash -n scripts/api-check.sh
      - name: release dry run
        # The release job only runs on a tag, so its script is exercised here.
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/release.sh
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
