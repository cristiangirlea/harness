name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # Whether this event changes anything but Markdown. A Markdown-only change (AGENTS.md
    # excepted: scripts/verify.sh checks its script index) builds and tests nothing. The
    # required test jobs still run and report, skipping their steps, so the ruleset's checks
    # pass; the other jobs are skipped. Anything unclear counts as code.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          code=true
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) range="$BEFORE..$AFTER" ;;
            *) range="" ;;
          esac
          if [ -n "$range" ] && files="$(git diff --name-only "$range")" && [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                AGENTS.md) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changes beyond Markdown: $code"

  test:
    needs: changes
    # Standard hosted runners are free for public repositories. Refuse private-minute usage.
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Use Git Bash consistently on Linux and Windows.
    defaults:
      run:
        shell: bash
    steps:
      - name: Markdown only, nothing to build or test
        if: needs.changes.outputs.code != 'true'
        run: echo "This change touches only Markdown; the build and tests are skipped."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
      - if: needs.changes.outputs.code == 'true'
        run: go vet ./...
      - if: needs.changes.outputs.code == 'true'
        run: go build ./...
      - if: needs.changes.outputs.code == 'true'
        run: go test -count=1 ./...
      - name: test with the race detector
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: fuzz the SSE parser
        # Bound the number of fuzz workers independently of the runner's CPU count.
        # Counts, not durations (#70): with -fuzztime=10s Go's coordinator can report its
        # own deadline as a failure (a race between closing the deadline and cancelling
        # the workers), and minimization could take 60 s per input, longer than the run, so
        # all four workers could spend it minimizing. Each count is about 10 s on the lab
        # machine.
        # A count is the only bound left, and Go has no per-input hang detection, so a
        # hanging input would hold a runner slot: each step stops at 5 minutes, and fails,
        # so the next step and the crasher upload still run.
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: go test -run='^$' -fuzz=FuzzParseSSE -fuzztime=150000x -fuzzminimizetime=200x -parallel=4 ./internal/agent
      - name: fuzz the MCP codec
        # always(), so a crash in the parser fuzzer does not hide this one.
        if: always() && needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: go test -run='^$' -fuzz=FuzzCodec -fuzztime=500000x -fuzzminimizetime=200x -parallel=4 ./internal/mcp
      - name: keep any input a fuzzer crashed on
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
      - name: shell scripts parse
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: bash -n .github/release.sh && bash -n scripts/api-check.sh
      - name: kept scripts verify
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: bash scripts/verify.sh --check
      - name: release dry run
        # The release job only runs on a tag, so its script is exercised here.
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: bash .github/release.sh
      - name: gofmt
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: test -z "$(gofmt -l .)"

  server-unit:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  server-postgres:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harness_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      HRN_TEST_DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/harness_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go test -race -count=1 ./...

  charts:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v4.3.0
      - name: install chart verifier
        run: python -m pip install PyYAML==6.0.3
      - name: render and verify tenant and project charts
        run: python server/deploy/verify_charts.py
      - name: build development image
        run: docker build -f server/Dockerfile -t hrn-durable-fixture:ci .
